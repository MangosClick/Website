<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home | Halcyon</title>
  <meta name="description" content="Halcyon selects residences worth owning in Cyprus, Montenegro and Georgia, starting from 100,000€.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300&family=Unbounded:wght@400;500&display=swap">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="preload" as="image" href="assets/img/home-hero.jpg">
  <script>
    /* Pre-hide the hero pieces until home.js starts the intro (no flash of the final layout).
       Safety net: if the intro never starts, show everything after 4s. */
    (function (d) {
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;
      d.documentElement.classList.add('home-intro-pending');
      window.__homeIntroSafety = setTimeout(function () { d.documentElement.classList.remove('home-intro-pending'); }, 4000);
    })(document);
  </script>
</head>
<body class="page-home" data-page="home" data-theme="light">
  <div id="page-stage">
    <main>
      <div class="page-grid">
        <nav class="site-nav" data-site-nav></nav>

        <div class="hero-section">
          <h1 class="visually-hidden">Halcyon: residences worth owning in Cyprus, Montenegro and Georgia</h1>

          <div class="hero-top">
            <div class="hero-visual">
              <img class="hero-visual__img" src="assets/img/home-hero.jpg" alt="A sunlit terrace looking out over the sea" width="1600" height="1600" fetchpriority="high" decoding="async">
            </div>

            <div class="marquee" data-marquee data-speed="95" data-direction="-1" aria-hidden="true">
              <span class="marquee__item">Higher Ground</span>
            </div>
          </div>

          <div class="hero-bottom">
            <div class="hero-content">
              <p class="hero-lead">
                <span class="hero-lead__line"><span class="hero-lead__inner">Hand-picked homes that hold their value</span></span>
                <span class="hero-lead__line"><span class="hero-lead__inner">across Cyprus, Montenegro and Georgia.</span></span>
              </p>
              <span class="tag hero-tag">Starting from 100,000€</span>
            </div>
          </div>
        </div>

        <footer class="site-footer" data-site-footer></footer>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" integrity="sha384-Z3REaz79l2IaAZqJsSABtTbhjgOUYyV3p90XNnAPCSHg3EMTz1fouunq9WZRtj3d" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" integrity="sha384-B2WBjDzEjJpYvhmi2UyEn7rektqkf5suS6sNoyyrf0EBAwBHdkiXxIlU0V5Ru2ed" crossorigin="anonymous"></script>
  <script src="js/core.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
