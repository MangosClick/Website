<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Palmview Dentistry</title>
  <link rel="icon" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Cormorant+Garamond:wght@500&family=DM+Sans:wght@400;500;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>

  <section class="page-hero">
    <img src="assets/img/page-hero.jpg" alt="">
    <div class="diamonds" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="hero-text"><small>Palmview Dentistry</small><h1>Contact</h1></div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="info-cards">
        <div class="info-card reveal">
          <div class="icon-circle"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M54 30a22 22 0 1 0-8 17"/><path d="M54 18v12H42"/><path d="M32 20v13l8 5"/></svg></div>
          <h3>Business Hours</h3><p>Mon – Fri: 8am – 6pm<br>Sat: 9am – 2pm · Sun: Closed</p>
        </div>
        <div class="info-card reveal reveal-d1">
          <div class="icon-circle"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 6a14 14 0 0 0-14 14c0 11 14 26 14 26s14-15 14-26A14 14 0 0 0 32 6Z"/><circle cx="32" cy="20" r="5"/><path d="M22 42H12L6 58h52l-6-16H42M12 50h40"/></svg></div>
          <h3>Address</h3><p>1520 Wilshire Blvd., Suite 300<br>Santa Monica, CA 90403</p>
        </div>
        <div class="info-card reveal reveal-d2">
          <div class="icon-circle"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 16c-5 5 0 16 9 25s20 14 25 9l3-3-9-9-6 5c-5-2-11-8-13-13l5-6-9-9Z"/><path d="M38 10c8 1 14 7 15 15m-17-7c4 1 7 4 8 8"/></svg></div>
          <h3>Contact</h3><p><a href="tel:+13105550142">(310) 555-0142</a><br>(310) 555-0143 – FAX</p>
        </div>
      </div>

      <div class="contact-form-wrap reveal" id="form">
        <h2>have any questions?</h2>
        <form class="form">
          <input placeholder="First" aria-label="First name" required>
          <input placeholder="Last" aria-label="Last name">
          <input class="full" type="tel" placeholder="Phone" aria-label="Phone" required>
          <input class="full" type="email" placeholder="Email" aria-label="Email" required>
          <textarea class="full" placeholder="How may we help you?" aria-label="Message"></textarea>
          <button class="btn btn--sm" type="submit">Submit</button>
          <p class="form-note" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>

  <iframe class="map" title="Map to Palmview Dentistry" loading="lazy" src="https://maps.google.com/maps?q=1520%20Wilshire%20Blvd%2C%20Santa%20Monica%2C%20CA%2090403&z=15&output=embed"></iframe>

  <div id="site-footer"></div>
  <script src="assets/js/main.js"></script>
</body>
</html>
